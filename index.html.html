<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首尔 2026 · Seoul 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#EDEFE9;
  --card:#FFFFFF;
  --ink:#16242B;
  --ink2:#5F7076;
  --hair:#D6DAD2;
  --line2:#00A84D;   /* Seoul Metro Line 2 green — the line this trip lives on */
  --line1:#0B4EA2;   /* station / transit info */
  --flag:#E4761B;    /* booked, paid, don't-miss */
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#fff;
  padding:10px 16px calc(10px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.mark{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark .zh{font-weight:700;font-size:16px;letter-spacing:.04em}
.mark .en{
  font-family:"Darker Grotesque",sans-serif;font-weight:800;
  font-size:26px;line-height:1;letter-spacing:.02em;color:var(--line2);
}
.langtoggle{display:flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;overflow:hidden;flex:none}
.langtoggle button{padding:5px 12px;font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.02em}
.langtoggle button[aria-pressed="true"]{background:var(--line2);color:#06120b;font-weight:700}

/* ---------- layout ---------- */
main{max-width:560px;margin:0 auto;padding:16px 14px 32px}
.panel[hidden]{display:none}
.sechead{
  font-family:"Darker Grotesque",sans-serif;font-weight:800;
  font-size:32px;line-height:.95;letter-spacing:.01em;margin:26px 2px 12px;
}
.sechead:first-child{margin-top:4px}
.sechead .sub{display:block;font-family:"Noto Sans SC",sans-serif;font-size:13px;font-weight:400;color:var(--ink2);letter-spacing:0;margin-top:5px;line-height:1.4}
html[lang="zh"] .sechead{font-family:"Noto Sans SC",sans-serif;font-size:21px;line-height:1.3}

.card{background:var(--card);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:10px}

/* ---------- hero: boarding strip ---------- */
.strip{background:var(--ink);color:#fff;border-radius:var(--radius);overflow:hidden}
.leg{padding:14px 16px}
.leg + .leg{border-top:1px dashed rgba(255,255,255,.22)}
.legtop{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.04em}
.legtop b{color:var(--line2);font-weight:700}
.route{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.port{flex:none}
.port .code{font-family:"Darker Grotesque",sans-serif;font-weight:800;font-size:34px;line-height:.85;letter-spacing:.02em}
.port .term{font-size:11px;color:rgba(255,255,255,.6)}
.port .tm{font-size:13px;font-weight:500;margin-top:3px}
.dots{flex:1;border-bottom:1px dotted rgba(255,255,255,.4);margin:0 2px 14px;position:relative}
.dots::after{content:"✈";position:absolute;right:-2px;top:-13px;font-size:12px;color:var(--line2)}
.port.right{text-align:right}
.countdown{
  background:var(--line2);color:#06140c;padding:9px 16px;
  font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;justify-content:space-between;
}

/* ---------- info rows ---------- */
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);align-items:flex-start}
.kv:last-child{border-bottom:none;padding-bottom:0}
.kv:first-child{padding-top:0}
.kv .k{flex:none;width:74px;font-size:12px;color:var(--ink2);padding-top:2px}
.kv .v{flex:1;font-size:14px}

.cardtitle{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cardtitle .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}

/* ---------- day rail ---------- */
.day{position:relative;padding-left:46px;padding-bottom:18px}
.day::before{content:"";position:absolute;left:15px;top:8px;bottom:-10px;width:3px;background:var(--line2)}
.day:last-child::before{bottom:auto;height:14px}
.stop{
  position:absolute;left:0;top:0;width:33px;height:33px;border-radius:50%;
  background:var(--card);border:3px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-family:"Darker Grotesque",sans-serif;font-weight:800;font-size:19px;line-height:1;
  padding-top:2px;z-index:1;
}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:8px;min-height:33px}
.dayhead .date{font-size:12px;color:var(--ink2);letter-spacing:.03em;width:100%;margin-top:-2px}
.dayhead h3{font-size:17px;line-height:1.3}

.plan{margin:0 0 2px}
.plan li{position:relative;padding-left:16px;margin-bottom:6px;font-size:14px}
.plan li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--hair)}
.plan li b{font-weight:700}

.note{
  background:#FDF3E7;border-left:3px solid var(--flag);
  padding:9px 12px;border-radius:0 8px 8px 0;font-size:13.5px;margin-top:10px;
}
.note .lab{font-size:11px;color:var(--flag);font-weight:700;letter-spacing:.05em;display:block;margin-bottom:2px}

/* ---------- food ---------- */
.foodgroup{margin-top:10px}
.eat{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--hair)}
.eat:last-child{border-bottom:none;padding-bottom:0}
.eat .num{
  flex:none;width:20px;font-family:"Darker Grotesque",sans-serif;font-weight:700;
  font-size:19px;color:var(--hair);line-height:1.1;
}
.eat .body{flex:1;min-width:0}
.eat .nm{font-size:14.5px;font-weight:500;line-height:1.35}
.eat .alt{font-size:12.5px;color:var(--ink2)}
.way{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--line1)}
.exit{
  display:inline-flex;align-items:center;gap:4px;
  background:#EAF0F9;color:var(--line1);border-radius:5px;padding:1px 7px;font-weight:700;font-size:11.5px;
}
.way .walk{color:var(--ink2)}

/* ---------- checklists ---------- */
.check{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--hair);align-items:flex-start;cursor:pointer;user-select:none}
.check:last-child{border-bottom:none;padding-bottom:0}
.box{
  flex:none;width:19px;height:19px;border:2px solid var(--hair);border-radius:5px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;
}
.box svg{width:11px;height:11px;opacity:0;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check[data-on="1"] .box{background:var(--line2);border-color:var(--line2)}
.check[data-on="1"] .box svg{opacity:1}
.check[data-on="1"] .txt{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--hair)}
.txt{flex:1;font-size:14px;line-height:1.45}
.txt small{display:block;color:var(--ink2);font-size:12px;text-decoration:none}
.check:focus-visible{outline:2px solid var(--line1);outline-offset:3px;border-radius:6px}

.progress{font-size:12px;color:var(--ink2);font-weight:400;float:right;padding-top:4px}

/* ---------- bottom nav ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--hair);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabs button{flex:1;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
.tabs .ic{width:22px;height:22px;stroke:var(--ink2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs .lb{font-size:11px;color:var(--ink2);letter-spacing:.02em}
.tabs button[aria-selected="true"] .ic{stroke:var(--line2)}
.tabs button[aria-selected="true"] .lb{color:var(--ink);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--line1);outline-offset:-2px}

.foot{text-align:center;font-size:11.5px;color:var(--ink2);padding:22px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ============================================================
   checklist state
   ============================================================ */
let ticks = {};
async function loadTicks(){
  try{
    if(window.storage){
      const r = await window.storage.get("seoul2026:ticks");
      if(r && r.value) ticks = JSON.parse(r.value);
    }
  }catch(e){ /* first run, nothing saved yet */ }
}
async function saveTicks(){
  try{ if(window.storage) await window.storage.set("seoul2026:ticks", JSON.stringify(ticks)); }catch(e){}
}

/* ============================================================
   renderers
   ============================================================ */
function flightHTML(f){
  return `<div class="leg">
    <div class="legtop"><span>${esc(t(f.tag))} · ${esc(t(f.date))}</span><b>${f.no}</b></div>
    <div class="route">
      <div class="port">
        <div class="code">${f.from.code}</div>
        <div class="term">${esc(t(f.from.term))}</div>
        <div class="tm">${f.from.time}</div>
      </div>
      <div class="dots"></div>
      <div class="port right">
        <div class="code">${f.to.code}</div>
        <div class="term">${esc(t(f.to.term))}</div>
        <div class="tm">${f.to.time}</div>
      </div>
    </div>
  </div>`;
}

function countdownHTML(){
  const dep = new Date("2026-09-15T22:00:00+08:00");
  const now = new Date();
  const d = Math.ceil((dep - now) / 86400000);
  let right;
  if(d > 1) right = `${d} ${t(UI.days)}`;
  else if(d === 1) right = lang==="zh" ? "明天" : "tomorrow";
  else if(d === 0) right = t(UI.today);
  else right = t(UI.gone);
  return `<div class="countdown"><span>${esc(t(UI.countdown))}</span><span>${esc(right)}</span></div>`;
}

function eatHTML(item, i){
  const bits = [];
  if(t(item.st)) bits.push(`<span>${esc(t(item.st))}</span>`);
  if(item.ex) bits.push(`<span class="exit">${lang==="zh"?"出口":"Exit"} ${item.ex}</span>`);
  if(t(item.walk)) bits.push(`<span class="walk">${esc(t(item.walk))}</span>`);
  return `<li class="eat">
    <span class="num">${i+1}</span>
    <span class="body">
      <span class="nm">${esc(t(item.nm))}</span>
      ${t(item.alt) ? `<span class="alt">${esc(t(item.alt))}</span>` : ""}
      ${bits.length ? `<span class="way">${bits.join("")}</span>` : ""}
    </span>
  </li>`;
}

function groupHTML(key){
  const g = FOOD[key];
  return `<div class="card foodgroup">
    <div class="cardtitle"><span class="dot"></span>${esc(t(g.title))}</div>
    <ul>${g.items.map(eatHTML).join("")}</ul>
  </div>`;
}

function dayHTML(d){
  const foods = d.food ? (Array.isArray(d.food) ? d.food : [d.food]) : [];
  return `<article class="day">
    <span class="stop">${d.n}</span>
    <div class="dayhead">
      <span class="date">${esc(t(d.date))}</span>
      <h3>${esc(t(d.title))}</h3>
    </div>
    <div class="card">
      <ul class="plan">${d.plan.map(p=>`<li>${t(p)}</li>`).join("")}</ul>
      ${d.note ? `<div class="note"><span class="lab">${lang==="zh"?"记得":"Remember"}</span>${esc(t(d.note))}</div>` : ""}
    </div>
    ${foods.map(k=>{
      const g = FOOD[k];
      return `<div class="card foodgroup">
        <div class="cardtitle"><span class="dot"></span>${esc(t(UI.eatHere))} · ${esc(t(g.title))}</div>
        <ul>${g.items.map(eatHTML).join("")}</ul>
      </div>`;
    }).join("")}
  </article>`;
}

function checkHTML(gid, i, item, done){
  return `<li class="check" tabindex="0" role="checkbox" aria-checked="${done?"true":"false"}"
      data-key="${gid}:${i}" data-on="${done?1:0}">
    <span class="box"><svg viewBox="0 0 14 14"><polyline points="2,7.5 5.5,11 12,3.5"/></svg></span>
    <span class="txt">${esc(t(item))}</span>
  </li>`;
}

function listGroupHTML(g, verb){
  const done = g.items.filter((_,i)=>ticks[g.id+":"+i]).length;
  return `<div class="card">
    <div class="cardtitle"><span class="dot"></span>${esc(t(g.title))}
      <span class="progress">${done}/${g.items.length} ${esc(t(verb))}</span></div>
    <ul>${g.items.map((it,i)=>checkHTML(g.id,i,it,!!ticks[g.id+":"+i])).join("")}</ul>
  </div>`;
}

function render(){
  document.documentElement.lang = lang;

  /* Trip */

}

/* ---- bottom navigation ---- */
const TABS = [
  { id:"trip", label:UI.trip, icon:'<path d="M4 20V6a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/><path d="M8 13h7M8 17h5"/>' },

  { id:"pack", label:UI.pack, icon:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M9 7V4h6v3"/><path d="M3 13h18"/>' },
  { id:"shop", label:UI.shop, icon:'<path d="M4 8h16l-1.2 11a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8Z"/><path d="M9 11V6a3 3 0 0 1 6 0v5"/>' }
];
let active = "trip";
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(tb=>`
    <button role="tab" data-tab="${tb.id}" aria-selected="${active===tb.id}">
      <svg class="ic" viewBox="0 0 24 24">${tb.icon}</svg>
      <span class="lb">${esc(t(tb.label))}</span>
    </button>`).join("");
}
function showTab(id){
  active = id;
  TABS.forEach(tb => document.getElementById("p-"+tb.id).hidden = (tb.id !== id));
  renderTabs();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---- events ---- */
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]");
  if(b) showTab(b.dataset.tab);
});
document.body.addEventListener("click", e=>{
  const c = e.target.closest(".check");
  if(c) toggle(c);
});
document.body.addEventListener("keydown", e=>{
  if(e.key===" " || e.key==="Enter"){
    const c = e.target.closest(".check");
    if(c){ e.preventDefault(); toggle(c); }
  }
});
function toggle(el){
  const on = el.dataset.on === "1";
  el.dataset.on = on ? "0" : "1";
  el.setAttribute("aria-checked", on ? "false" : "true");
  ticks[el.dataset.key] = !on;
  if(!ticks[el.dataset.key]) delete ticks[el.dataset.key];
  const card = el.closest(".card");
  const p = card.querySelector(".progress");
  if(p){
    const total = card.querySelectorAll(".check").length;
    const done = card.querySelectorAll('.check[data-on="1"]').length;
    p.textContent = `${done}/${total} ` + p.textContent.split(" ").slice(1).join(" ");
  }
  saveTicks();
}
function setLang(l){
  lang = l;
  document.getElementById("btn-zh").setAttribute("aria-pressed", l==="zh");
  document.getElementById("btn-en").setAttribute("aria-pressed", l==="en");
  render();
  showTab(active);
}
document.getElementById("btn-zh").addEventListener("click", ()=>setLang("zh"));
document.getElementById("btn-en").addEventListener("click", ()=>setLang("en"));

/* ---- go ---- */
loadTicks().then(()=>{ render(); showTab("trip"); });
